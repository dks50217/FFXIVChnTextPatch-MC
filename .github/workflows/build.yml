name: build

on:
  push:
  pull_request:

jobs:
  # 所有檢查都由 Rust 版執行（輸出已驗證與 C# 版逐字相同）；不依賴 WPF，可以跑在 Linux 上。
  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Sheet 參照檢查要 merge-base，淺 clone 抓不到 base 分支

      - name: Build
        run: cargo build --release --locked

      # 報告寫在 repo 根目錄（BaseDir = conf/ 所在）。exit code 是計數、封頂 255。
      # Actions 的 bash 預設 -e，所以用 `|| code=$?` 先接住結束碼，印完報告再回傳。
      - name: Self-test (binary-format checks)
        run: ./target/release/ffxiv_chn_text_patch --selftest

      - name: Lint translation CSVs
        run: |
          code=0; ./target/release/ffxiv_chn_text_patch --lint || code=$?
          sed '/^■ 覆蓋率/q' ../lint-report.txt   # 覆蓋率清單有七千多行，只印到它的標題
          exit $code

      # Sheet 標籤參照檢查：譯文裡 Sheet 標籤的參數（去哪張表、讀第幾欄）必須跟日文原文
      # 一致，照陸版的欄號翻過來會讓該介面閃退。只比對這個 PR 改動到的儲存格；
      # 參照資料是 resource/ja-sheetsig.txt.gz，所以 CI 不需要遊戲也不需要 SaintCoinach。
      # warn-only：全庫有 1173 筆歷史差異且絕大多數無害，參照不符 ≠ 一定閃退，只是請人看一眼。
      - name: Sheet tag reference check (warn-only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          # 走環境變數而不是直接插進腳本，分支名才不會被當成 shell 語法執行
          BASE_REF: ${{ github.base_ref }}
        run: |
          code=0; ./target/release/ffxiv_chn_text_patch --sheetsig "origin/$BASE_REF" || code=$?
          cat ../sheetsig-report.txt
          exit $code

      # 漂移檢查：clone 上游、逐檔比對「上游空/本地有翻譯」的錯位。warn-only：
      # 偶爾誤報（本地翻在上游前）或上游/網路問題只讓這一步紅燈，不擋整體 build。
      - name: Drift check vs upstream (warn-only)
        continue-on-error: true
        run: |
          code=0; ./target/release/ffxiv_chn_text_patch --driftcheck || code=$?
          cat ../rawexd-drift.txt 2>/dev/null || echo "乾淨，無疑似錯位。"
          exit $code

  # C# 版仍是發行版本，至少確保它編譯得過。C# 退役時刪掉這個 job。
  csharp:
    runs-on: windows-latest   # WPF 目標，只能在 Windows 上建置
    defaults:
      run:
        working-directory: csharp/FFXIVChnTextPatch
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build -c Release --nologo
